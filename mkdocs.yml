site_name: My Machines Documentation Portal
site_url: "https://docs.my-machines.com"
site_author: "Edgar Mata"

theme:
  name: 'material'
  features:
    - navigation.tabs          # Menu superior horizontal por famílias de máquinas
    - navigation.sections      # Agrupa os submenus na barra lateral de forma limpa
    - navigation.expand        # Mantém as secções expansíveis na lateral
    - navigation.top           # Botão "Voltar ao topo" automático em páginas longas
    - search.suggest           # Sugestões automáticas na barra de pesquisa
    - search.highlight         # Destaca o texto pesquisado nas páginas

  language: en # Mantém em inglês global para a comunidade mundial
  palette:
    # Modo Escuro (Dark Mode) por padrão - Tom Maker/Industrial
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Opção Modo Claro
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

plugins:
  - search        

