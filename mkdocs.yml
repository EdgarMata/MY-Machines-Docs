# Project information
site_name: My Machines Documentation Portal
site_url: "https://docs.my-machines.com"
site_author: "Edgar Mata"
site_description: "My Machines knowledge base"

# Repository global
repo_name: "EdgarMata/my-machines-docs"
repo_url: "https://github.com/EdgarMata/my-machines-docs"
edit_uri: edit/main/docs/

# Copyright dinâmico
copyright: '&copy; 2022 - <span id="current-year"></span> <a href="https://my-machines.net/" target="_blank" rel="noopener">My Machines</a> by Edgar Mata'

# Configuration
theme:
  name: 'material'
  language: 'en' # Mantém em inglês global para a comunidade mundial
  logo: assets/mylogo.svg
  favicon: images/f-icon.png
  custom_dir: overrides
  features:
    - navigation.tabs          # Menu superior horizontal por famílias de máquinas
#   - navigation.sections      # Agrupa os submenus na barra lateral de forma limpa
#   - navigation.expand        # Mantém as secções expansíveis na lateral
    - navigation.top           # Botão "Voltar ao topo" automático
    - navigation.path
    - navigation.footer
    - toc.follow
    - search.suggest           # Sugestões automáticas na pesquisa
    - search.highlight         # Destaca o texto pesquisado
    - search.share
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - header.autohide

  palette:
    # Ajuste automático pelo sistema operacional
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: System Preferences

    # Modo Claro (Light Mode)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: light blue
      accent: indigo

    # Modo Escuro (Dark Mode)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to Light mode
      primary: light blue
      accent: indigo

  icon:
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/EdgarMata
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/machines.net/
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/machines_net/
    - icon: fontawesome/brands/pinterest
      link: https://pt.pinterest.com/machines_net
    - icon: fontawesome/brands/tiktok
      link: https://www.tiktok.com/@machines_net
    - icon: fontawesome/solid/paper-plane
      link: mailto:geral@my-machines.net
  analytics:
    provider: google
    property: G-B2Y6R89EJ9
    feedback:
      title: Did this page help?
      ratings:
        - icon: material/thumb-up-outline
          name: Did this page help
          data: 1
          note: >-
            Thanks for the feedback!
        - icon: material/thumb-down-outline
          name: This page can be improved
          data: 0
          note: >-
            Thanks for the feedback! Help us improve this page
            using our <a href="https://docs.google.com/forms/d/e/1FAIpQLSf_kuzfD_Tbez4b-jqxr0dPAsu4QGP72imTuG0AKUAi-gQKLg/viewform?usp=pp_url&entry.756152555={url}" target="_blank" rel="noopener">feedback form</a>.

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css
  - assets/extra.css

markdown_extensions:
    - tables
    - pymdownx.highlight:
        anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - def_list
    - pymdownx.magiclink
    - pymdownx.tasklist:
        custom_checkbox: true
    - admonition
    - pymdownx.superfences
    - pymdownx.arithmatex:
        generic: true
    - footnotes
    - pymdownx.details
    - pymdownx.mark
    - pymdownx.caret
    - pymdownx.tilde
    - attr_list
    - md_in_html
    - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - pymdownx.keys
    - toc:
        permalink: true
        title: Table of Contents

