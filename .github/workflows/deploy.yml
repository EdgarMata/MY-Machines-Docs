name: debug-teste-portas

on:
  push:
    branches: [ main, master ]

jobs:
  diagnostico-rede:
    runs-on: ubuntu-latest
    steps:
      - name: Testar Conexao com o VPS
        run: |
          echo "=================================================="
          echo "1. A TESTAR PORTA WEB 80 (Nginx Proxy Manager):"
          nc -zv -w 10 217.65.146.37 80
          
          echo "=================================================="
          echo "2. A TESTAR PORTA SSH 22 (Acesso ao Servidor):"
          nc -zv -w 10 217.65.146.37 22
          echo "=================================================="