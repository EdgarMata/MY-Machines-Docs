name: deploy-docs

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Preparar Python (Motor MkDocs)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar MkDocs Material
        run: pip install mkdocs-material

      - name: Compilar Site Estatico
        run: mkdocs build

      - name: Sincronizar com Servidor Oracle (Deploy)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SERVER_IP: ${{ secrets.VPS_IP }}
          SERVER_USER: ${{ secrets.VPS_USER }}
        run: |
          # 1. Criar a pasta SSH
          mkdir -p ~/.ssh
          
          # 2. Injetar a chave e ajustar permissoes
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 3. Forcar o protocolo SSH a aceitar a chave da Oracle Cloud
          cat << EOF > ~/.ssh/config
          Host oracleserver
            HostName $SERVER_IP
            User $SERVER_USER
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            PubkeyAcceptedAlgorithms +ssh-rsa
            HostkeyAlgorithms +ssh-rsa
          EOF
          chmod 600 ~/.ssh/config
          
          # 4. Enviar os ficheiros usando a configuracao blindada
          rsync -avz -e "ssh" --delete site/ oracleserver:/opt/infrastructure/mkdocs/site/